[project]
name = "sandbox-arena"
version = "0.3.0"
description = "A local sandbox attack lab with versioned scenarios, host evidence verification, replay and benchmarks"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/Apache-2.0.txt"]
authors = [
    { name = "rudrakshkarpe", email = "rudraksh.karpe@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1,<1",
    "logfire>=5.2.0,<6",
    "pydantic>=2.14.1,<3",
    "pydantic-ai-slim[openai]>=2.59.0,<3",
    "pydantic-evals>=2.59.0,<3",
    "pydantic-monty==1.2.0",
    "uvicorn>=0.54.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sandbox-arena = "sandbox_arena.cli:main"
monty-lab = "sandbox_arena.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]
