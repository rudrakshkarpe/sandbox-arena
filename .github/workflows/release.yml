name: Publish release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run sandbox-arena evaluate
      - run: uv build
      - run: uv run python scripts/check_dist.py --tag "$GITHUB_REF_NAME"
      - name: Verify packaged CLI outside the checkout
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m sandbox_arena.cli attack caught-denial --iterations 1 --output report.json
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m sandbox_arena.cli verify report.json
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m sandbox_arena.cli replay report.json --output replay.json
      - name: Publish preview artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --prerelease --title "Sandbox Arena $GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
