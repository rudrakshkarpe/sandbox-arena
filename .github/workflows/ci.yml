name: Verify demo
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run sandbox-arena evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: artifacts/
          if-no-files-found: ignore
