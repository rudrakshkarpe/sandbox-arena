name: Verify demo
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run sandbox-arena evaluate
      - run: uv build
      - run: uv run python scripts/check_dist.py
      - name: Smoke test the installed wheel outside the checkout
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m sandbox_arena.cli attack caught-denial --iterations 1 --output report.json
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m sandbox_arena.cli verify report.json
          "$GITHUB_WORKSPACE/.venv/bin/python" -I -m sandbox_arena.cli replay report.json --output replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: artifacts/evaluation.json
          if-no-files-found: ignore
